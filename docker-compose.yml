version: "3.9"

services:

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    networks:
      - stt-network
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      WHISPER_URL: "http://whisper:8000"
    networks:
      - stt-network
    depends_on:
      - whisper

  whisper:
    build: ./whisper
    networks:
      - stt-network

networks:
  stt-network:
